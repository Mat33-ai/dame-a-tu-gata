
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAME A TU GATO</title>

  <style>
    body {
      background-color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    button {
      background-color: black;
      color: white;
      font-size: 32px;
      font-weight: bold;
      padding: 30px 40px;
      border: 3px solid black;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: white;
      color: black;
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <button onclick="alert('ENTREGA EL GATO INMEDIATAMENTE 🐈‼️')">
    HOLA DAME A TU GATO
  </button>
</body>
</html>
